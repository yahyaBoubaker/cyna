security:
  password_hashers:
    App\Entity\User:
      algorithm: auto
  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    api:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      custom_authenticator: App\Security\JwtAuthenticator
      entry_point: App\Security\JwtAuthenticator
  access_control:
    - { path: ^/api/admin, roles: ROLE_ADMIN }
    - { path: ^/api/me, roles: ROLE_USER }
    - { path: ^/api/cart, roles: ROLE_USER }
    - { path: ^/api/checkout, roles: ROLE_USER }
