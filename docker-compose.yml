services:
  mysql:
    image: mysql:8.3
    container_name: cyna_mysql
    environment:
      MYSQL_DATABASE: cyna
      MYSQL_USER: cyna
      MYSQL_PASSWORD: cyna
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/fixtures.sql:/docker-entrypoint-initdb.d/02-fixtures.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-symfony
    container_name: cyna_backend
    environment:
      APP_ENV: dev
      APP_SECRET: change-me-in-production
      DATABASE_URL: mysql://cyna:cyna@mysql:3306/cyna?serverVersion=8.3.0&charset=utf8mb4
      JWT_SECRET: dev-jwt-secret-change-me
      CORS_ALLOW_ORIGIN: ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$
    ports:
      - "8000:8000"
    volumes:
      - ./backend-symfony:/app
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -lc "composer update --with-all-dependencies && php bin/console doctrine:migrations:migrate --no-interaction || true && php bin/console doctrine:fixtures:load --no-interaction || true && symfony server:start --no-tls --allow-http --listen-ip=0.0.0.0 --port=8000"

  frontend:
    image: node:22-alpine
    container_name: cyna_frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend-react:/app
    ports:
      - "5173:5173"
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

  backoffice:
    image: node:22-alpine
    container_name: cyna_backoffice
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./backoffice-react:/app
    ports:
      - "5174:5174"
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5174"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: cyna_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
